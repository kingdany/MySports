# Aggiorna i dati ogni 3 ore e li pubblica sul branch gh-pages (servito da GitHub Pages).
name: Aggiorna dati

on:
  schedule:
    - cron: "15 */3 * * *"   # minuto 15 per evitare il picco di inizio ora di GitHub
  workflow_dispatch:          # avvio manuale dalla scheda Actions
    inputs:
      seasons:
        description: "Stagioni passate da importare (es. 1950-2025, 2019,2021 oppure 2024-25 per il calcio). Vuoto = aggiornamento normale"
        required: false
        default: ""
      competition:
        description: "Competizione delle stagioni passate (f1, serie-a)"
        required: false
        default: "f1"
      standings_only:
        description: "Solo classifiche (non riscarica gli eventi delle stagioni già importate)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # l'importazione dello storico può attendere a lungo il limite di Jolpica
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # I dati precedenti servono all'importatore (video già trovati, ripiego se una fonte è giù).
      - name: Recupera i dati pubblicati
        run: |
          if git fetch --depth 1 origin gh-pages; then
            git worktree add site FETCH_HEAD
            git -C site checkout -B gh-pages
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rf --quiet .
          fi

      - name: Esegui l'importatore
        env:
          SEASONS: ${{ inputs.seasons }}
          COMPETITION: ${{ inputs.competition }}
          STANDINGS_ONLY: ${{ inputs.standings_only && '--standings-only' || '' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ -n "$SEASONS" ]; then
            dotnet run --project src/MySports.Importer -c Release -- --out site --competition "$COMPETITION" --seasons "$SEASONS" $STANDINGS_ONLY
          else
            dotnet run --project src/MySports.Importer -c Release -- --out site
          fi

      # Si pubblica anche se una fonte o una stagione ha dato errore: le altre sono state salvate.
      - name: Pubblica
        if: success() || failure()
        working-directory: site
        run: |
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Aggiornamento dati $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push origin gh-pages
